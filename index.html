<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro | Repositor de Mercadorias</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f3f0;
    color: #1f1f1f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 1000px;
    background: #ffffff;
    border-radius: 24px;
    padding: 40px 30px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08);
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #1f1f1f;
}

.header p {
    font-size: 16px;
    color: #666666;
    line-height: 1.6;
}

.video-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 10px auto 25px;
}

.video-box {
    position: relative;
    width: min(100%, 430px);
    aspect-ratio: 9 / 16;
    background: #000000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,0.15);
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000000;
}

.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 78px;
    height: 78px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.96);
    color: #1f1f1f;

    font-size: 30px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 8px 30px rgba(0,0,0,0.35);

    transition: all 0.3s ease;
}

.play-button:hover {
    transform: translate(-50%, -50%) scale(1.08);
}

.play-button.hidden {
    display: none;
}

.notice {
    text-align: center;
    font-size: 15px;
    color: #777777;
    line-height: 1.5;
    margin-top: 5px;
}

.footer {
    text-align: center;
    margin-top: 30px;
    color: #999999;
    font-size: 12px;
}

@keyframes aparecer {

    0% {
        opacity: 0;
        transform: scale(0.92);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

.cadastro-final {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    background: #1f1f1f;
    color: #ffffff;

    font-size: 28px;
    font-weight: 700;

    border-radius: 18px;

    animation: aparecer 0.8s ease forwards;

    transition: all 0.3s ease;
}

.cadastro-final:hover {
    background: #333333;
    transform: scale(1.02);
}

@media (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    .container {
        padding: 28px 18px;
        border-radius: 18px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        font-size: 14px;
    }

    .video-box {
        width: min(100%, 380px);
        border-radius: 15px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Repositor de Mercadorias</h1>

        <p>
            Assista ao vídeo completo antes de realizar seu cadastro.
            Ao final, o botão de cadastro será liberado.
        </p>

    </div>


    <div class="video-area">

        <div class="video-box" id="videoBox">

            <video
                id="video"
                playsinline
                preload="auto"
                disablePictureInPicture
                oncontextmenu="return false;"
            >

                <source
                    src="https://res.cloudinary.com/uqats0ee/video/upload/v1791983597/video-repositor.mp4.mp4"
                    type="video/mp4"
                >

                Seu navegador não suporta a reprodução deste vídeo.

            </video>


            <button
                id="playButton"
                class="play-button"
                type="button"
                aria-label="Iniciar vídeo"
            >
                ▶
            </button>

        </div>

    </div>


    <div
        class="notice"
        id="notice"
    >
        Clique no botão para iniciar o vídeo.
    </div>


    <div class="footer">

        GM Promo • Recrutamento e Seleção

    </div>

</div>


<script>

const video = document.getElementById("video");

const videoBox = document.getElementById("videoBox");

const playButton = document.getElementById("playButton");

const notice = document.getElementById("notice");

let ultimaPosicao = 0;

let iniciou = false;


/* INICIAR O VÍDEO */

playButton.addEventListener("click", function () {

    iniciou = true;

    video.play();

    playButton.classList.add("hidden");

    notice.textContent =
        "Assista ao vídeo até o final para liberar o cadastro.";

});


/* IMPEDIR AVANÇO */

video.addEventListener("timeupdate", function () {

    if (video.currentTime > ultimaPosicao + 0.5) {

        video.currentTime = ultimaPosicao;

    } else {

        ultimaPosicao = video.currentTime;

    }

});


/* IMPEDIR TENTATIVA DE AVANÇAR/RETROCEDER */

video.addEventListener("seeking", function () {

    if (video.currentTime > ultimaPosicao + 0.5) {

        video.currentTime = ultimaPosicao;

    }

});


/* IMPEDIR ALTERAÇÃO DE VELOCIDADE */

video.addEventListener("ratechange", function () {

    if (video.playbackRate !== 1) {

        video.playbackRate = 1;

    }

});


/* IMPEDIR PAUSA DEPOIS QUE COMEÇOU */

video.addEventListener("pause", function () {

    if (iniciou && !video.ended) {

        video.play();

    }

});


/* QUANDO O VÍDEO TERMINAR */

video.addEventListener("ended", function () {

    videoBox.innerHTML = `
    
        <a
            class="cadastro-final"
            href="https://forms.gle/A1ZPQe8f62gcNPhQ7"
            target="_blank"
            rel="noopener noreferrer"
        >
            Cadastre-se
        </a>

    `;

    notice.textContent =
        "Vídeo concluído! Seu cadastro está liberado.";

});


/* BLOQUEAR BOTÃO DIREITO */

video.addEventListener("contextmenu", function (event) {

    event.preventDefault();

});


/* BLOQUEAR TECLAS DE AVANÇO/RETROCESSO */

document.addEventListener("keydown", function (event) {

    const teclasBloqueadas = [
        "ArrowLeft",
        "ArrowRight",
        "Home",
        "End",
        " ",
        "MediaPlayPause"
    ];

    if (teclasBloqueadas.includes(event.key)) {

        event.preventDefault();

    }

});

</script>

</body>

</html>
